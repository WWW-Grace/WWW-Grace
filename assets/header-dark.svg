<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .fade { opacity: 0; animation: in .9s ease-out forwards; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } .cursor { animation: none; } }
    </style>
  </defs>

  <text class="mono fade d1" x="450" y="70" text-anchor="middle" font-size="15" letter-spacing="4" fill="#7d8590">~/www-grace</text>

  <text class="sans fade d2" x="450" y="140" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="-2" fill="#e6edf3">hi, i'm grace<tspan fill="url(#g)">.</tspan></text>

  <g class="fade d3">
    <text class="mono" x="450" y="186" text-anchor="middle" font-size="16" fill="#7d8590">building things for the web<tspan class="cursor" fill="#38bdf8"> ▍</tspan></text>
    <rect x="390" y="212" width="120" height="2" rx="1" fill="url(#g)"/>
  </g>
</svg>
