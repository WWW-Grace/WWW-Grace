<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6e8">
        <animate attributeName="stop-color" values="#ffd6e8;#e4d7ff;#cfe9ff;#ffd6e8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".5" stop-color="#e4d7ff">
        <animate attributeName="stop-color" values="#e4d7ff;#cfe9ff;#ffd6e8;#e4d7ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#cfe9ff">
        <animate attributeName="stop-color" values="#cfe9ff;#ffd6e8;#e4d7ff;#cfe9ff" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="220" rx="28"/></clipPath>
    <style>
      .round { font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Quicksand", -apple-system, "Segoe UI", sans-serif; }
    </style>
    <path id="spark" d="M0 -11 C1.6 -2.2 2.2 -1.6 11 0 C2.2 1.6 1.6 2.2 0 11 C-1.6 2.2 -2.2 1.6 -11 0 C-2.2 -1.6 -1.6 -2.2 0 -11Z"/>
    <path id="heart" d="M0 4 C-6 -1 -9 -4 -9 -7.5 C-9 -10.5 -6.5 -12 -4.5 -12 C-2.5 -12 -1 -10.8 0 -9.2 C1 -10.8 2.5 -12 4.5 -12 C6.5 -12 9 -10.5 9 -7.5 C9 -4 6 -1 0 4Z"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="220" fill="url(#bg)"/>

    <!-- wandering bubbles -->
    <circle cx="70" cy="190" r="70" fill="#fff" opacity=".35">
      <animateTransform attributeName="transform" type="translate" values="0 0;60 -30;140 -10;80 20;0 0" dur="16s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="30" r="56" fill="#fff" opacity=".35">
      <animateTransform attributeName="transform" type="translate" values="0 0;-90 30;-160 10;-70 -15;0 0" dur="18s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="185" r="22" fill="#fff" opacity=".45">
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 -40;-120 -10;-50 15;0 0" dur="11s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="40" r="14" fill="#fff" opacity=".45">
      <animateTransform attributeName="transform" type="translate" values="0 0;70 25;150 5;90 -15;0 0" dur="12s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="200" r="30" fill="#fff" opacity=".3">
      <animateTransform attributeName="transform" type="translate" values="0 0;80 -20;30 -45;-60 -15;0 0" dur="14s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="25" r="10" fill="#fff" opacity=".5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 20;-110 5;-40 -10;0 0" dur="10s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </circle>

    <!-- little hearts drifting up -->
    <g fill="#ff9cc8">
      <use href="#heart" x="300" y="240" opacity="0">
        <animate attributeName="y" values="240;-20" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;.8;0" keyTimes="0;.2;.7;1" dur="7s" repeatCount="indefinite"/>
      </use>
      <use href="#heart" x="610" y="240" opacity="0" fill="#b9a2f5">
        <animate attributeName="y" values="240;-20" dur="8s" begin="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;.8;0" keyTimes="0;.2;.7;1" dur="8s" begin="2.5s" repeatCount="indefinite"/>
      </use>
      <use href="#heart" x="460" y="240" opacity="0" fill="#8fcaff">
        <animate attributeName="y" values="240;-20" dur="9s" begin="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.7;.7;0" keyTimes="0;.2;.7;1" dur="9s" begin="5s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- twinkling, spinning sparkles -->
  <g transform="translate(165 62)"><use href="#spark" fill="#ff8fbf">
    <animateTransform attributeName="transform" type="rotate" values="0;180" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></use></g>
  <g transform="translate(740 84)"><use href="#spark" fill="#a78bfa">
    <animateTransform attributeName="transform" type="rotate" values="0;-180" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin=".8s" repeatCount="indefinite"/></use></g>
  <g transform="translate(210 162) scale(.8)"><use href="#spark" fill="#7cc4ff">
    <animateTransform attributeName="transform" type="rotate" values="0;180" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></use></g>
  <g transform="translate(695 162) scale(.8)"><use href="#spark" fill="#ff8fbf">
    <animateTransform attributeName="transform" type="rotate" values="0;-180" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></use></g>

  <!-- title gently bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.2s" repeatCount="indefinite"/>
    <text class="round" x="430" y="118" text-anchor="middle" font-size="58" font-weight="800" fill="#4a3b5c">hi, i'm grace</text>
    <!-- beating heart -->
    <g transform="translate(642 98) scale(2.2)">
      <use href="#heart" fill="#ff7eb6">
        <animateTransform attributeName="transform" type="scale" values="1;1.18;1;1.12;1;1" keyTimes="0;.12;.24;.36;.48;1" dur="1.6s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <text class="round" x="450" y="162" text-anchor="middle" font-size="20" font-weight="600" fill="#8a7a9e">idk what i'm doing</text>
  <g transform="translate(560 155)">
    <text class="round" x="0" y="7" text-anchor="middle" font-size="20" fill="#c08fd6">✿
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
